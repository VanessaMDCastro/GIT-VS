# ============================================================
#  APLICAÇÃO
# ============================================================
spring.application.name=delivery-api

# ============================================================
#  SERVIDOR
# ============================================================
server.port=8080

# ============================================================
#  BANCO DE DADOS (H2 em memória)
# ============================================================
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
#  H2 CONSOLE  ->  http://localhost:8080/h2-console
#  JDBC URL no console: jdbc:h2:mem:deliverydb
#  User: sa  |  Password: (vazio)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
#  JPA / HIBERNATE
# ============================================================
# create-drop: recria o schema a cada start (ótimo para dev com H2 em memória)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false

# Garante que data.sql rode DEPOIS do Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

# ============================================================
#  INICIALIZAÇÃO DE DADOS (data.sql / schema.sql)
# ============================================================
# always: sempre roda | embedded (default): só em H2/HSQL/Derby | never
spring.sql.init.mode=always
# Se um dia quiser permitir continuar mesmo com erro num INSERT:
# spring.sql.init.continue-on-error=true

# ============================================================
#  DEVTOOLS
# ============================================================
spring.devtools.restart.enabled=true

# ============================================================
#  JACKSON / SERIALIZAÇÃO
# ============================================================
# Evita LazyInitializationException ao serializar coleções Lazy
spring.jpa.open-in-view=false

# ============================================================
#  LOGGING
# ============================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ==========================================
# ACTUATOR, PROMETHEUS E OBSERVABILIDADE (NOVOS)
# ==========================================
# Expondo todos os endpoints
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator

# Health & Métricas
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true

# Tracing e Zipkin
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Informações da Aplicação (Endpoint /info)
info.app.name=Sistema de Delivery
info.app.description=API REST para sistema de delivery com observabilidade
info.app.version=1.0.0
info.team.name=Equipe de Desenvolvimento
info.team.email=dev@delivery.co